<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 — 목격자</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" />
    <style>
        /* 12.PNG 사진과 일치하는 정갈하고 부드러운 둥근 고딕 폰트 로드 */
        @import url('https://cdn.jsdelivr.net/gh/moonspam/NanumSquareRound@2.0/nanumsquareround.css');

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --brand: #2F6B4F;
            --brand-dark: #1E4634;
            --brand-light: #A7C4B5;
            --bg: #F4F6F2;
            --ok: #639922;
            --ok-bg: #EAF3DE;
            --ok-border: #C0DD97;
            --alert: #E24B4A;
            --alert-bg: #FCEBEB;
            --alert-border: #F7C1C1;
            --text: #1B2D23;
            --muted: #4A6B58;
            --white: #fff;
        }

        body {
            /* 전체 폰트를 나눔스퀘어라운드로 통일하여 캡처본 서체 반영 */
            font-family: 'NanumSquareRound', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topnav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 28px;
            background: var(--white);
            border-bottom: 1px solid rgba(47,107,79,0.12);
        }
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 17px;
            font-weight: 800;
            color: var(--brand-dark);
            text-decoration: none;
        }
        .logo-box {
            width: 30px;
            height: 30px;
            background: var(--brand);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .auth-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .auth-card {
            background: var(--white);
            border-radius: 20px;
            border: 1px solid rgba(47,107,79,0.12);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 24px rgba(47,107,79,0.08);
        }

        /* 스텝 표시 */
        .step-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            margin-bottom: 28px;
        }
        .step-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            border: 2px solid;
            transition: all .3s;
            flex-shrink: 0;
        }
        .step-dot.done { background: var(--brand); border-color: var(--brand); color: #fff; }
        .step-dot.active { background: var(--white); border-color: var(--brand); color: var(--brand); }
        .step-dot.idle { background: var(--white); border-color: var(--brand-light); color: var(--brand-light); }
        .step-line { width: 40px; height: 2px; transition: background .3s; }
        .step-line.done { background: var(--brand); }
        .step-line.idle { background: var(--brand-light); }

        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-header h1 {
            font-size: 21px;
            font-weight: 800;
            color: var(--brand-dark);
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }
        .auth-header p {
            font-size: 13.5px;
            color: var(--muted);
            font-weight: 700;
        }

        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
        .form-input-wrap { position: relative; display: flex; gap: 8px; }
        .form-input-wrap i.field-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--muted); z-index: 2; }

        .form-input { flex: 1; width: 100%; padding: 11px 14px 11px 40px; border: 1.5px solid rgba(47,107,79,0.2); border-radius: 10px; font-size: 14px; color: var(--text); background: var(--white); outline: none; transition: border-color .15s; font-family: 'NanumSquareRound', sans-serif; font-weight: 700; }
        .form-input:focus { border-color: var(--brand); }
        .form-input.error { border-color: var(--alert); }
        .form-input.success { border-color: var(--ok); }
        .form-input:disabled { background: #f9f9f9; color: var(--muted); cursor: not-allowed; }

        .btn-inline { padding: 0 16px; border-radius: 10px; font-size: 13px; font-weight: 700; font-family: 'NanumSquareRound', sans-serif; border: 1.5px solid rgba(47,107,79,0.2); background: var(--white); color: var(--muted); cursor: pointer; white-space: nowrap; transition: all .15s; }
        .btn-inline:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); }
        .btn-inline:disabled { opacity: 0.5; cursor: not-allowed; }

        .timer-text { position: absolute; right: 84px; top: 50%; transform: translateY(-50%); font-size: 13px; font-weight: 700; color: var(--alert); z-index: 2; }

        .form-input-wrap .toggle-pw { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); font-size: 16px; padding: 2px; z-index: 2; }
        .form-input-wrap .toggle-pw:hover { color: var(--brand); }

        .form-input-wrap .check-icon { position: absolute; right: 88px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--ok); display: none; z-index: 2; }
        #pw-match-icon { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--ok); display: none; z-index: 2; }

        .error-msg { font-size: 11px; color: var(--alert); margin-top: 5px; display: none; align-items: center; gap: 4px; font-weight: 700; }
        .error-msg i { font-size: 13px; }
        .success-msg { font-size: 11px; color: var(--ok); margin-top: 5px; display: none; align-items: center; gap: 4px; font-weight: 700; }
        .success-msg i { font-size: 13px; }

        .pw-strength { margin-top: 8px; }
        .pw-strength-bar { display: flex; gap: 4px; margin-bottom: 4px; }
        .pw-strength-bar span { flex: 1; height: 4px; border-radius: 100px; background: #E8EFE4; transition: background .3s; }
        .pw-strength-label { font-size: 11px; color: var(--muted); font-weight: 700; }

        .terms-check { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; background: var(--bg); border-radius: 10px; margin-bottom: 14px; cursor: pointer; }
        .terms-check input { width: 16px; height: 16px; accent-color: var(--brand); cursor: pointer; flex-shrink: 0; margin-top: 1px; }
        .terms-check-text { font-size: 12px; color: var(--muted); line-height: 1.5; font-weight: 700; }
        .terms-check-text a { color: var(--brand); text-decoration: none; }
        .terms-check-text a:hover { text-decoration: underline; }

        .btn-submit { width: 100%; padding: 13px; border-radius: 100px; font-size: 15px; font-weight: 800; font-family: 'NanumSquareRound', sans-serif; border: none; cursor: pointer; transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--brand); color: #fff; margin-bottom: 16px; }
        .btn-submit:hover:not(:disabled) { background: var(--brand-dark); }
        .btn-submit:disabled { opacity: .6; cursor: default; }

        .btn-outline { width: 100%; padding: 11px; border-radius: 100px; font-size: 14px; font-weight: 700; font-family: 'NanumSquareRound', sans-serif; border: 1.5px solid rgba(47,107,79,0.2); cursor: pointer; transition: all .15s; background: var(--white); color: var(--muted); margin-bottom: 16px; }
        .btn-outline:hover { border-color: var(--brand); color: var(--brand); }

        .auth-divider { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .auth-divider::before, .auth-divider::after { content: ''; flex: 1; height: 1px; background: rgba(47,107,79,0.12); }
        .auth-divider span { font-size: 12px; color: var(--muted); font-weight: 700; }

        .btn-social { width: 100%; padding: 11px; border-radius: 100px; font-size: 14px; font-weight: 700; font-family: 'NanumSquareRound', sans-serif; border: 1.5px solid rgba(47,107,79,0.2); cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--white); color: var(--text); margin-bottom: 10px; }
        .btn-social:hover { border-color: var(--brand); background: var(--bg); }
        .social-icon { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex-shrink: 0; }
        .social-icon.google { background: #EA4335; color: #fff; }
        .social-icon.kakao { background: #FEE500; color: #3C1E1E; }

        .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted); font-weight: 700; }
        .auth-footer a { color: var(--brand); font-weight: 800; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }

        .complete-view { text-align: center; padding: 20px 0; }
        .complete-icon { width: 72px; height: 72px; border-radius: 50%; background: var(--ok-bg); border: 3px solid var(--ok); display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 20px; animation: popIn .4s ease; }
        @keyframes popIn { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .complete-view h2 { font-size: 22px; font-weight: 800; color: var(--brand-dark); margin-bottom: 8px; }
        .complete-view p { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 28px; }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<nav class="topnav">
    <a href="index.html" class="nav-logo">
        <div class="logo-box">🐢</div>
        목격자
    </a>
</nav>

<div class="auth-wrap">
    <div class="auth-card">

        <div class="step-bar">
            <div class="step-dot active" id="sd1">1</div>
            <div class="step-line idle" id="sl1"></div>
            <div class="step-dot idle" id="sd2">2</div>
            <div class="step-line idle" id="sl2"></div>
            <div class="step-dot idle" id="sd3">✓</div>
        </div>

        <div id="step1">
            <div class="auth-header">
                <h1>목격자에 오신 걸 환영해요!</h1>
                <p>기본 정보를 입력해주세요</p>
            </div>

            <div class="form-group">
                <label class="form-label">이름</label>
                <div class="form-input-wrap">
                    <i class="ti ti-user field-icon"></i>
                    <input type="text" class="form-input" id="name-input" placeholder="홍길동" />
                </div>
                <div class="error-msg" id="name-error"><i class="ti ti-alert-circle"></i><span>이름을 입력해주세요</span></div>
            </div>

            <div class="form-group">
                <label class="form-label">이메일</label>
                <div class="form-input-wrap">
                    <i class="ti ti-mail field-icon"></i>
                    <input type="email" class="form-input" id="email-input" placeholder="email@example.com" oninput="checkEmail()" />
                    <i class="ti ti-check check-icon" id="email-check"></i>
                    <button type="button" class="btn-inline" id="btn-send-code" onclick="sendAuthCode()" disabled>인증 요청</button>
                </div>
                <div class="error-msg" id="email-error"><i class="ti ti-alert-circle"></i><span>올바른 이메일 형식을 입력해주세요</span></div>
                <div class="success-msg" id="email-success"><i class="ti ti-check"></i><span>사용 가능한 이메일이에요. 인증 코드가 발송되었습니다.</span></div>
            </div>

            <div class="form-group" id="code-group" style="display: none;">
                <label class="form-label">인증 코드</label>
                <div class="form-input-wrap">
                    <i class="ti ti-shield-check field-icon"></i>
                    <input type="text" class="form-input" id="code-input" placeholder="6자리 코드 입력" maxlength="6" />
                    <span class="timer-text" id="timer">03:00</span>
                    <button type="button" class="btn-inline" id="btn-verify-code" onclick="verifyAuthCode()">확인</button>
                </div>
                <div class="error-msg" id="code-error"><i class="ti ti-alert-circle"></i><span>인증 코드가 일치하지 않거나 만료되었습니다.</span></div>
                <div class="success-msg" id="code-success"><i class="ti ti-check"></i><span>이메일 인증이 완료되었습니다!</span></div>
            </div>

            <button class="btn-submit" onclick="goStep2()">
                <i class="ti ti-arrow-right"></i>
                다음
            </button>

            <div class="auth-divider"><span>또는 간편 가입</span></div>
            <button class="btn-social"><div class="social-icon google">G</div>Google로 가입하기</button>
            <button class="btn-social"><div class="social-icon kakao">K</div>카카오로 가입하기</button>

            <div class="auth-footer">이미 계정이 있으신가요? <a href="login.html">로그인</a></div>
        </div>

        <div id="step2" style="display:none;">
            <div class="auth-header">
                <h1>비밀번호를 설정해요</h1>
                <p>안전한 비밀번호를 입력해주세요</p>
            </div>

            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <div class="form-input-wrap">
                    <i class="ti ti-lock field-icon"></i>
                    <input type="password" class="form-input" id="pw-input" placeholder="8자 이상 입력" oninput="checkPwStrength()" />
                    <button type="button" class="toggle-pw" onclick="togglePw('pw-input', this)"><i class="ti ti-eye"></i></button>
                </div>
                <div class="pw-strength" id="pw-strength" style="display:none;">
                    <div class="pw-strength-bar">
                        <span id="str1"></span><span id="str2"></span><span id="str3"></span><span id="str4"></span>
                    </div>
                    <div class="pw-strength-label" id="str-label"></div>
                </div>
                <div class="error-msg" id="pw-error"><i class="ti ti-alert-circle"></i><span>8자 이상 입력해주세요</span></div>
            </div>

            <div class="form-group">
                <label class="form-label">비밀번호 확인</label>
                <div class="form-input-wrap">
                    <i class="ti ti-lock field-icon"></i>
                    <input type="password" class="form-input" id="pw-confirm" placeholder="비밀번호 재입력" oninput="checkPwMatch()" />
                    <button type="button" class="toggle-pw" onclick="togglePw('pw-confirm', this)"><i class="ti ti-eye"></i></button>
                    <i class="ti ti-check check-icon" id="pw-match-icon"></i>
                </div>
                <div class="error-msg" id="pw-confirm-error"><i class="ti ti-alert-circle"></i><span>비밀번호가 일치하지 않아요</span></div>
                <div class="success-msg" id="pw-confirm-success"><i class="ti ti-check"></i><span>비밀번호가 일치해요</span></div>
            </div>

            <label class="terms-check">
                <input type="checkbox" id="terms-check" />
                <span class="terms-check-text">
          <a href="#">이용약관</a> 및 <a href="#">개인정보처리방침</a>에 동의합니다. 서비스 이용을 위해 필수로 동의해야 해요.
        </span>
            </label>

            <button class="btn-submit" onclick="goStep3()">
                <i class="ti ti-user-plus"></i>
                가입 완료
            </button>
            <button class="btn-outline" onclick="backStep1()">
                <i class="ti ti-arrow-left" style="font-size:13px;margin-right:4px;"></i>
                이전
            </button>
        </div>

        <div id="step3" style="display:none;">
            <div class="complete-view">
                <div class="complete-icon">✓</div>
                <h2>가입이 완료됐어요!</h2>
                <p>목격자와 함께 바른 자세 습관을<br>만들어 나가볼까요?</p>
                <button class="btn-submit" onclick="window.location.href='calibration.html'">
                    <i class="ti ti-camera"></i>
                    캘리브레이션 시작하기
                </button>
                <button class="btn-outline" onclick="window.location.href='index.html'">
                    메인으로 이동
                </button>
            </div>
        </div>

    </div>
</div>

<script>
    let isEmailVerified = false;
    let timerInterval = null;

    function togglePw(id, btn) {
        const input = document.getElementById(id);
        const icon = btn.querySelector('i');
        input.type = input.type === 'password' ? 'text' : 'password';
        icon.className = input.type === 'password' ? 'ti ti-eye' : 'ti ti-eye-off';
    }

    function checkEmail() {
        if (isEmailVerified) return;
        const val = document.getElementById('email-input').value.trim();
        const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);

        document.getElementById('email-check').style.display = ok ? 'block' : 'none';
        document.getElementById('btn-send-code').disabled = !ok;
        document.getElementById('email-input').className = 'form-input ' + (ok ? 'success' : '');
        document.getElementById('email-success').style.display = ok ? 'flex' : 'none';
        document.getElementById('email-error').style.display = 'none';
    }

    // 💡 수정 포인트: 인증 요청 시 알림(alert)창 팝업을 띄우고 숨겨진 입력창과 타이머를 개방합니다.
    function sendAuthCode() {
        alert("인증번호가 발송되었습니다."); // 발송 알림 팝업 추가
        document.getElementById('email-success').style.display = 'flex';
        document.getElementById('code-group').style.display = 'flex';
        startTimer(180);
    }

    function startTimer(duration) {
        clearInterval(timerInterval);
        let timer = duration, minutes, seconds;
        const timerDisplay = document.getElementById('timer');

        timerInterval = setInterval(() => {
            minutes = parseInt(timer / 60, 10);
            seconds = parseInt(timer % 60, 10);

            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            timerDisplay.textContent = minutes + ":" + seconds;

            if (--timer < 0) {
                clearInterval(timerInterval);
                timerDisplay.textContent = "만료";
                document.getElementById('btn-verify-code').disabled = true;
            }
        }, 1000);
    }

    function verifyAuthCode() {
        const code = document.getElementById('code-input').value.trim();

        if (code.length === 6) {
            clearInterval(timerInterval);
            isEmailVerified = true;

            document.getElementById('code-success').style.display = 'flex';
            document.getElementById('code-error').style.display = 'none';
            document.getElementById('email-success').style.display = 'none';

            document.getElementById('email-input').disabled = true;
            document.getElementById('code-input').disabled = true;
            document.getElementById('btn-send-code').disabled = true;
            document.getElementById('btn-verify-code').disabled = true;
            document.getElementById('timer').style.display = 'none';
            document.getElementById('email-check').style.display = 'none';

            document.getElementById('email-input').className = 'form-input success';
            document.getElementById('code-input').className = 'form-input success';
        } else {
            document.getElementById('code-error').style.display = 'flex';
        }
    }

    function checkPwStrength() {
        const pw = document.getElementById('pw-input').value;
        const bar = document.getElementById('pw-strength');
        bar.style.display = pw ? 'block' : 'none';
        let score = 0;
        if (pw.length >= 8) score++;
        if (/[A-Z]/.test(pw)) score++;
        if (/[0-9]/.test(pw)) score++;
        if (/[^A-Za-z0-9]/.test(pw)) score++;
        const colors = ['#E24B4A','#BA7517','#639922','#2F6B4F'];
        const labels = ['취약','보통','강함','매우 강함'];
        for (let i = 1; i <= 4; i++) {
            document.getElementById('str'+i).style.background = i <= score ? colors[score-1] : '#E8EFE4';
        }
        document.getElementById('str-label').textContent = score > 0 ? labels[score-1] : '';
        document.getElementById('str-label').style.color = score > 0 ? colors[score-1] : '';
    }

    function checkPwMatch() {
        const pw = document.getElementById('pw-input').value;
        const confirm = document.getElementById('pw-confirm').value;
        const match = pw === confirm && confirm.length > 0;
        document.getElementById('pw-match-icon').style.display = match ? 'block' : 'none';
        document.getElementById('pw-confirm').className = 'form-input ' + (match ? 'success' : confirm ? 'error' : '');
        document.getElementById('pw-confirm-success').style.display = match ? 'flex' : 'none';
        document.getElementById('pw-confirm-error').style.display = (!match && confirm) ? 'flex' : 'none';
    }

    function updateSteps(step) {
        for (let i = 1; i <= 3; i++) {
            const dot = document.getElementById('sd'+i);
            dot.className = 'step-dot ' + (i < step ? 'done' : i === step ? 'active' : 'idle');
            if (i < step) dot.innerHTML = '<i class="ti ti-check" style="font-size:12px;"></i>';
            else dot.textContent = i < 3 ? i : '✓';
        }
        for (let i = 1; i <= 2; i++) {
            document.getElementById('sl'+i).className = 'step-line ' + (i < step ? 'done' : 'idle');
        }
    }

    function goStep2() {
        const name = document.getElementById('name-input').value.trim();
        const email = document.getElementById('email-input').value.trim();
        let valid = true;
        if (!name) { document.getElementById('name-error').style.display = 'flex'; valid = false; }
        else document.getElementById('name-error').style.display = 'none';
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { document.getElementById('email-error').style.display = 'flex'; valid = false; }
        else document.getElementById('email-error').style.display = 'none';

        if (valid && !isEmailVerified) {
            alert('이메일 인증을 완료해주세요.');
            valid = false;
        }

        if (!valid) return;
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
        updateSteps(2);
    }

    function backStep1() {
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step1').style.display = 'block';
        updateSteps(1);
    }

    function goStep3() {
        const name = document.getElementById('name-input').value.trim();
        const email = document.getElementById('email-input').value.trim();
        const pw = document.getElementById('pw-input').value;
        const confirm = document.getElementById('pw-confirm').value;
        const terms = document.getElementById('terms-check').checked;
        let valid = true;
        if (pw.length < 8) { document.getElementById('pw-error').style.display = 'flex'; valid = false; }
        else document.getElementById('pw-error').style.display = 'none';
        if (pw !== confirm) { document.getElementById('pw-confirm-error').style.display = 'flex'; valid = false; }
        if (!terms) { alert('이용약관에 동의해주세요.'); valid = false; }
        if (!valid) return;

        const btn = document.querySelector('#step2 .btn-submit');
        btn.disabled = true;
        const originalBtnHtml = btn.innerHTML;
        btn.innerHTML = '<i class="ti ti-loader" style="animation:spin .8s linear infinite;"></i> 처리 중...';

        fetch('/api/members/signup', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ name: name, email: email, password: pw })
        })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('회원가입 처리 중 오류가 발생했습니다.');
                    }
                    return response.json();
                })
                .then(data => {
                    document.getElementById('step2').style.display = 'none';
                    document.getElementById('step3').style.display = 'block';
                    updateSteps(3);
                })
                .catch(error => {
                    alert(error.message);
                    btn.disabled = false;
                    btn.innerHTML = originalBtnHtml;
                });
    }
</script>
</body>
</html>
